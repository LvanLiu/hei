name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.2.0（会发布为 v0.2.0）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # 把版本写进 Info.plist，让 Finder 的「显示简介」和包内一致
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Sources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Sources/Info.plist
          echo "hei $VERSION (build ${GITHUB_RUN_NUMBER})"

      - name: Build
        run: make build

      - name: Smoke test
        run: ./build/hei.app/Contents/MacOS/hei --selftest

      - name: Package DMG
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/payload
          cp -R build/hei.app dist/payload/
          ln -s /Applications dist/payload/Applications
          hdiutil create -volname "hei" -srcfolder dist/payload -ov -format UDZO \
            "dist/hei-${VERSION}.dmg"
          ( cd dist && shasum -a 256 "hei-${VERSION}.dmg" > "hei-${VERSION}.dmg.sha256" )
          ls -lh dist

      - name: Write release notes
        run: |
          cat > dist/notes.md <<'EOF'
          macOS 窗口级切换器：按 `⇧⌘Space` 唤起，输入即筛，回车切到具体窗口。

          ## 安装

          1. 下载 `hei-*.dmg`，打开后把 **hei** 拖进「应用程序」。
          2. 首次打开：在 Finder 里**右键 → 打开**（应用是 ad-hoc 签名，没有 Apple 公证）。
             如果提示「已损坏」，在终端执行：
             ```bash
             xattr -dr com.apple.quarantine /Applications/hei.app
             ```
          3. 按 `⇧⌘Space`，在系统设置里给 hei 打开「辅助功能」权限。
          4. 需要 macOS 13+，Apple Silicon。

          ## 校验

          ```bash
          shasum -a 256 -c hei-*.dmg.sha256
          ```
          EOF
          cat dist/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/hei-"${VERSION}".dmg dist/hei-"${VERSION}".dmg.sha256 --clobber
          else
            gh release create "v${VERSION}" \
              dist/hei-"${VERSION}".dmg \
              dist/hei-"${VERSION}".dmg.sha256 \
              --title "hei v${VERSION}" \
              --notes-file dist/notes.md
          fi
          gh release view "v${VERSION}" --json url,tagName,assets --jq '"\(.url)  assets=\(.assets | length)"'
